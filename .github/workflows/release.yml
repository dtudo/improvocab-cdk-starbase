name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Build
        run: make prepare

      - name: Get release version
        id: get_release_version
        run: |
          npx @changesets/cli status --output=release.json
          echo "RELEASE_VERSION=$(jq -r '.releases[0].newVersion' release.json)" >> "$GITHUB_OUTPUT"
          rm release.json

      - name: Configure npm for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Release
        uses: changesets/action@v1
        with:
          title: 'release: v${{ steps.get_release_version.outputs.RELEASE_VERSION }}'
          commit: 'release: v${{ steps.get_release_version.outputs.RELEASE_VERSION }}'
          publish: npx @changesets/cli publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
